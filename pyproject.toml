[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnexp"
version = "0.1.0"
description = "Churn Detection and Retention Offer Experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "PyYAML>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.33",
    "plotly>=5.20",
    "httpx>=0.27",
]

[project.scripts]
churnexp = "churnexp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"churnexp.schema" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

